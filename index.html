<!DOCTYPE html>
<html>
<head>
     <title>Student Performance Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
 <div id="welcome-screen">
    <div class="welcome-content">
        <img src="images/spa logo.png" alt="SPA Logo">
        <h1>Welcome 🎓</h1>
        <p>Student Performance Analyzer</p>
    </div>
</div>  
<div class="site-title">
    <img src="images/spa logo.png" alt="SPA Logo" class="logo">
    <h1>Student Performance Analyzer</h1>
</div>

    <div class="container">
    <button id="theme-toggle">🌙 Dark Mode</button>
<h2>Enter Students Details & Marks</h2>
        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter student name">

        <label>Roll Number</label>
        <input type="text" id="roll" placeholder="Enter roll number">

        
<div id="subjects-container">
    <div class="subject-row">
        <input type="text" placeholder="Subject Name" class="subject-name">
        <input type="number" placeholder="Marks" class="subject-marks">
    </div>
</div>

<button type="button" id="add-subject">+ Add Subject</button>
        <button onclick="calculateResult()">Calculate Result</button>
<button onclick="resetForm()">Clear</button> 
<button onclick="printResult()">Print Result</button> 
<button onclick="shareResult()">📤 Share Result</button>
<button onclick="downloadResult()">Download Result</button>
     <div id="result-popup" class="result-popup">
    <div class="result-box">
        <button class="close-result" onclick="closeResult()">✕</button>
        <h2>🎓 Student Result</h2>
        <div id="result"></div>
    </div>
</div>   
        <button id="view-history">📚 View History</button>
        <button onclick="showPerformance()">📊 Student Performance</button>
<div id="history"></div> 
        <div id="performance-chart">
    <h3>📊 Subject Performance</h3>
    <div id="chart-bars"></div>
</div>
<div class="progress-container">
    <div id="progress-bar"></div>
</div>
    </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
