<!DOCTYPE html>
<html>
<head>
     <title>Student Performance Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<img src="images/spa logo.png" 
alt="SPA Logo" class="logo" 
style="width:120px!important;">
    <h1>Student Performance Analyzer</h1>

    <div class="container">
<h2>Enter Students Details & Marks</h2>
        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter student name">

        <label>Roll Number</label>
        <input type="text" id="roll" placeholder="Enter roll number">

        <label>Data Structures Marks</label>
        <input type="number" id="marks1" placeholder="Enter marks"min="0"max="100">

        <label>Digital Electronics Marks</label>
        <input type="number" id="marks2" placeholder="Enter marks"min="0"max="100">

        <label>Mathmatics Marks</label>
        <input type="number" id="marks3" placeholder="Enter marks"min="0"max="100">

        <button onclick="calculateResult()">Calculate Result</button>
<button onclick="resetForm()">Clear</button> 
<button onclick="printResult()">Print Result</button>
        <div id="result"></div>
<div class="progress-container">
    <div id="progress-bar"></div>
</div>
    </div>

    <script src="script.js"></script>

</body>
</html>
